apiVersion: v1
kind: Service
metadata:
  name: {{ include "cncnet-private-tunnel.fullname" . }}
  labels:
    {{- include "cncnet-private-tunnel.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "cncnet-private-tunnel.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: tunnel-v2-tcp
      port: {{ .Values.ports.tunnelV2 }}
      targetPort: tunnel-v2-tcp
      protocol: TCP
    - name: tunnel-v2-udp
      port: {{ .Values.ports.tunnelV2 }}
      targetPort: tunnel-v2-udp
      protocol: UDP
    - name: tunnel-v3-tcp
      port: {{ .Values.ports.tunnelV3 }}
      targetPort: tunnel-v3-tcp
      protocol: TCP
    - name: tunnel-v3-udp
      port: {{ .Values.ports.tunnelV3 }}
      targetPort: tunnel-v3-udp
      protocol: UDP
    - name: stun-udp
      port: {{ .Values.ports.stun }}
      targetPort: stun-udp
      protocol: UDP
    - name: stun-control
      port: {{ .Values.ports.stunControl }}
      targetPort: stun-control
      protocol: UDP
