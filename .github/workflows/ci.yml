name: adapter-ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check proprietary-asset boundary
        shell: pwsh
        run: ./ci/verify-no-assets.ps1
      - name: Parse lab PowerShell scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content ./ci/inspect-ra2-appliance.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./ci/verify-live-qualification.ps1 -Raw)) | Out-Null
      - name: Restore adapter
        run: dotnet restore src/Bindery.Ra2.Adapter/Bindery.Ra2.Adapter.csproj
      - name: Restore tests
        run: dotnet restore tests/Bindery.Ra2.Adapter.Tests/Bindery.Ra2.Adapter.Tests.csproj
      - name: Restore live acceptance harness
        run: dotnet restore tools/Bindery.Ra2.Adapter.LiveAcceptance/Bindery.Ra2.Adapter.LiveAcceptance.csproj
      - name: Restore appliance manifest tool
        run: dotnet restore tools/Bindery.Ra2.Adapter.ApplianceManifest/Bindery.Ra2.Adapter.ApplianceManifest.csproj
      - name: Restore control-plane gate
        run: dotnet restore tools/Bindery.Ra2.Adapter.ControlPlaneGate/Bindery.Ra2.Adapter.ControlPlaneGate.csproj
      - name: Restore channel tool
        run: dotnet restore tools/Bindery.Ra2.Adapter.Channel/Bindery.Ra2.Adapter.Channel.csproj
      - name: Build adapter
        run: dotnet build src/Bindery.Ra2.Adapter/Bindery.Ra2.Adapter.csproj --configuration Release --no-restore
      - name: Build live acceptance harness
        run: dotnet build tools/Bindery.Ra2.Adapter.LiveAcceptance/Bindery.Ra2.Adapter.LiveAcceptance.csproj --configuration Release --no-restore
      - name: Build appliance manifest tool
        run: dotnet build tools/Bindery.Ra2.Adapter.ApplianceManifest/Bindery.Ra2.Adapter.ApplianceManifest.csproj --configuration Release --no-restore
      - name: Build control-plane gate
        run: dotnet build tools/Bindery.Ra2.Adapter.ControlPlaneGate/Bindery.Ra2.Adapter.ControlPlaneGate.csproj --configuration Release --no-restore
      - name: Build channel tool
        run: dotnet build tools/Bindery.Ra2.Adapter.Channel/Bindery.Ra2.Adapter.Channel.csproj --configuration Release --no-restore
      - name: Test adapter
        run: dotnet test tests/Bindery.Ra2.Adapter.Tests/Bindery.Ra2.Adapter.Tests.csproj --configuration Release --no-restore
      - name: Restore strategic bot tests
        run: dotnet restore tests/Bindery.Ra2.Bot.Tests/Bindery.Ra2.Bot.Tests.csproj
      - name: Build strategic bot tests
        run: dotnet build tests/Bindery.Ra2.Bot.Tests/Bindery.Ra2.Bot.Tests.csproj --configuration Release --no-restore
      - name: Test strategic bot
        run: dotnet test tests/Bindery.Ra2.Bot.Tests/Bindery.Ra2.Bot.Tests.csproj --configuration Release --no-restore

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check proprietary-asset boundary
        shell: pwsh
        run: ./ci/verify-no-assets.ps1
      - name: Restore strategic bot projects
        run: |
          dotnet restore src/Bindery.Ra2.Bot/Bindery.Ra2.Bot.csproj
          dotnet restore src/Bindery.Ra2.Bot.Sim/Bindery.Ra2.Bot.Sim.csproj
          dotnet restore src/Bindery.Ra2.Bot.Claude/Bindery.Ra2.Bot.Claude.csproj
          dotnet restore tools/Bindery.Ra2.Bot.Arena/Bindery.Ra2.Bot.Arena.csproj
          dotnet restore tools/Bindery.Ra2.Bot.Tune/Bindery.Ra2.Bot.Tune.csproj
      - name: Build strategic bot projects
        run: |
          dotnet build src/Bindery.Ra2.Bot/Bindery.Ra2.Bot.csproj --configuration Release --no-restore
          dotnet build src/Bindery.Ra2.Bot.Sim/Bindery.Ra2.Bot.Sim.csproj --configuration Release --no-restore
          dotnet build src/Bindery.Ra2.Bot.Claude/Bindery.Ra2.Bot.Claude.csproj --configuration Release --no-restore
          dotnet build tools/Bindery.Ra2.Bot.Arena/Bindery.Ra2.Bot.Arena.csproj --configuration Release --no-restore
          dotnet build tools/Bindery.Ra2.Bot.Tune/Bindery.Ra2.Bot.Tune.csproj --configuration Release --no-restore
      - name: Restore strategic bot tests
        run: dotnet restore tests/Bindery.Ra2.Bot.Tests/Bindery.Ra2.Bot.Tests.csproj
      - name: Test strategic bot
        run: dotnet test tests/Bindery.Ra2.Bot.Tests/Bindery.Ra2.Bot.Tests.csproj --configuration Release --no-restore
      - name: Arena smoke run
        env:
          BINDERY_BOT_LIVE_LLM: "0"
        run: |
          dotnet run --project tools/Bindery.Ra2.Bot.Arena -- run \
            --arms selector --maps training --opponents balanced,ai-balanced --seeds 1 \
            --max-seconds 300 --out artifacts/arena
      - name: Tune smoke run
        run: |
          dotnet run --project tools/Bindery.Ra2.Bot.Tune -- search --date 2000-01-01 \
            --opponents ai-balanced,bot:default --generations 1 --population 2 --final-seeds 1 \
            --seeds-per-generation 1 --max-seconds 300 --out artifacts/tune
